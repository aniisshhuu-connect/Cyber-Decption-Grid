<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xan CRM | Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=10" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body data-page="dashboard">
    <div class="dashboard-shell">

      <aside class="sidebar">
        <!-- Brand -->
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
            <path d="M16 14l-2 6"/>
            <path d="M12 16l-2 6"/>
            <path d="M8 14l-2 6"/>
          </svg>
        </div>

        <nav id="role-menu" class="menu">
          <!-- Populated by script.js -->
        </nav>

        <button id="logout-btn" class="btn btn-outline" type="button" style="display:flex; gap:7px; align-items:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2 class="panel-title">Dashboard</h2>
            <p class="meta-line">Home / Overview</p>
          </div>
          <div class="user-chip-wrap">
            <input type="text" class="search-input" placeholder="Search..." />
            <div class="user-chip">
              <p id="header-username" style="font-weight: 700; font-size: 13px; letter-spacing: -0.01em;">—</p>
              <p id="header-role" class="meta-line" style="margin:0; font-size:9px;">—</p>
            </div>
          </div>
        </header>

        <div class="main-content">
          <!-- Bulk Actions -->
          <div id="bulk-actions-bar" class="bulk-actions-bar" style="display:none;">
            <div class="bulk-count">0 ITEMS SELECTED</div>
            <div class="bulk-actions">
              <button class="btn btn-outline">Export CSV</button>
              <button class="btn btn-primary">Mark Paid</button>
            </div>
          </div>

          <section id="stats-row" class="stats-row"></section>
          <section id="section-host" class="section-host spotlight-card"></section>
        </div>
      </main>

    </div>

    <!-- Modal -->
    <div id="detail-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="section-head">
          <h3 id="modal-title">Detail</h3>
          <button id="close-modal" type="button" class="btn btn-outline" style="height:30px; padding:0 12px; font-size:12px;">Close</button>
        </div>
        <div id="modal-content" class="detail-grid" style="margin-bottom:18px;"></div>
        <div class="modal-actions">
          <button id="modal-investigate" type="button" class="btn btn-primary">Process</button>
        </div>
      </div>
    </div>

    <script defer src="script.js?v=10"></script>
    <script>
      /* Spotlight effect */
      document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.spotlight-card').forEach(card => {
          const r = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', `${e.clientX - r.left}px`);
          card.style.setProperty('--mouse-y', `${e.clientY - r.top}px`);
        });
      });

      /* Observe section-host changes to inject checkboxes into new tables */
      const observer = new MutationObserver(() => {
        document.querySelectorAll('#section-host table:not([data-styled])').forEach(table => {
          const theadTr = table.querySelector('thead tr');
          if (theadTr) {
            const th = document.createElement('th');
            th.style.width = '36px';
            th.innerHTML = '<input type="checkbox" class="custom-checkbox select-all">';
            theadTr.insertBefore(th, theadTr.firstChild);
            th.querySelector('.select-all').addEventListener('change', e => {
              table.querySelectorAll('tbody .custom-checkbox').forEach(cb => cb.checked = e.target.checked);
              updateBulkBar();
            });
          }
          table.querySelectorAll('tbody tr').forEach(tr => {
            const td = document.createElement('td');
            td.style.width = '36px';
            td.innerHTML = '<input type="checkbox" class="custom-checkbox row-select">';
            tr.insertBefore(td, tr.firstChild);
            td.querySelector('.row-select').addEventListener('change', updateBulkBar);
          });
          table.dataset.styled = 'true';
        });

        /* Re-apply spotlight to new stat cards */
        document.querySelectorAll('.stat-card:not(:nth-child(5)):not(.spotlight-done)').forEach(card => {
          card.classList.add('spotlight-done');
        });
      });

      window.addEventListener('DOMContentLoaded', () => {
        observer.observe(document.getElementById('section-host'), { childList: true, subtree: true });
        observer.observe(document.getElementById('stats-row'), { childList: true, subtree: true });
      });

      function updateBulkBar() {
        const count = document.querySelectorAll('#section-host tbody .row-select:checked').length;
        const bar = document.getElementById('bulk-actions-bar');
        if (count > 0) {
          bar.style.display = 'flex';
          bar.querySelector('.bulk-count').textContent = `${count} Invoice${count > 1 ? 's' : ''} Selected`;
        } else {
          bar.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
